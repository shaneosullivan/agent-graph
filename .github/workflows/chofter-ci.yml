# Generated by ChofterCI. Do not edit by hand — edits are overwritten on sync.
# Source of truth: the ChofterCI web UI on your build machine (repo id rigvwq2pt).
#
# Test output is kept on this runner and not streamed to GitHub, so it can be read
# without a network call, and while GitHub is down. See the ChofterCI panel.
name: chofter-ci

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      autofix:
        description: 'Also run the autofix agent if the tests fail'
        type: boolean
        default: false

concurrency:
  group: chofter-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  ci:
    runs-on: [self-hosted, office]
    timeout-minutes: 75
    defaults:
      run:
        shell: bash        # the bash from Git for Windows
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CHOFTER_APP_ID }}
          private-key: ${{ secrets.CHOFTER_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Put local env files in place
        run: |
          ENV_DIR="$HOME/.chofter/env/$(printf %s "${{ github.repository }}" | sed 's#[^A-Za-z0-9._-][^A-Za-z0-9._-]*#__#g')"
          [ -d "$ENV_DIR" ] || echo "No local env files for this repo."
          n=0
          for f in "$ENV_DIR"/* "$ENV_DIR"/.*; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            if [ -e "./$base" ]; then
              echo "Kept the repo's own $base; not overwriting it with the uploaded copy."
              continue
            fi
            cp "$f" "./$base"
            # Keep it out of any commit. The agent stages with `git add -A`,
            # so without this a secret would ride along into its pull request.
            # info/exclude is local to this checkout and is never committed.
            grep -qxF "$base" .git/info/exclude 2>/dev/null || echo "$base" >> .git/info/exclude
            n=$((n+1))
          done
          echo "Restored $n env file(s) from this machine."

      - name: Open a local run log
        id: prep
        run: |
          RUNS_DIR="$HOME/.chofter/runs"
          SLUG=$(printf %s "${{ github.repository }}" | sed 's#[^A-Za-z0-9._-][^A-Za-z0-9._-]*#__#g')
          DIR="$RUNS_DIR/$SLUG"
          mkdir -p "$DIR"
          LOG="$DIR/${{ github.run_id }}.log"
          : > "$LOG"
          STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          {
            echo "dir=$DIR"
            echo "log=$LOG"
            echo "phase=$DIR/${{ github.run_id }}.phase"
            echo "agentlog=$DIR/agent-${{ github.run_id }}.log"
            echo "started=$STARTED"
            echo "prscript=$HOME/.chofter/bin/chofter-pr"
          } >> "$GITHUB_OUTPUT"
          echo "Logging to $LOG on $(hostname)"
          OUT="$DIR/output-${{ github.run_id }}"
          mkdir -p "$OUT"
          BASE="$(cat "$HOME/.chofter/output-url" 2>/dev/null || true)"
          [ -n "$BASE" ] || BASE="http://$(hostname):4311"
          {
            echo "CHOFTER_OUTPUT_DIR=$OUT"
            echo "CHOFTER_OUTPUT_URL=${BASE%/}/runs/${{ github.run_id }}/"
            echo "CHOFTER_LOG_URL=${BASE%/}/logs/${{ github.run_id }}"
          } >> "$GITHUB_ENV"
          echo "Files put in \$CHOFTER_OUTPUT_DIR are served at ${BASE%/}/runs/${{ github.run_id }}/"
          if [ -z "${npm_config_script_shell:-}" ]; then
            for c in "$PROGRAMFILES/Git/bin/bash.exe" "$LOCALAPPDATA/Programs/Git/bin/bash.exe"; do
              if [ -x "$c" ] && [ -n "${GITHUB_ENV:-}" ]; then
                echo "npm_config_script_shell=$c" >> "$GITHUB_ENV"
                echo "npm/pnpm scripts will run under $c, not cmd.exe"
                break
              fi
            done
          fi
          if [ ! -x "$HOME/.chofter/bin/chofter-pr" ]; then
            echo "WARNING: $HOME/.chofter/bin/chofter-pr is missing or not executable."
            echo "Autofix cannot open a PR. Start the ChofterCI panel once to install it,"
            echo "or re-run setup/2-wsl-bootstrap.sh on this machine."
          fi

      - name: Setup
        id: setup
        continue-on-error: true
        env:
          CHOFTER_LOG: ${{ steps.prep.outputs.log }}
          CHOFTER_PHASE: ${{ steps.prep.outputs.phase }}
        run: |
          printf '=== setup: %s ===\n' 'bash scripts/ci-setup.sh' >> "$CHOFTER_LOG"
          set +e
          { bash scripts/ci-setup.sh; } >> "$CHOFTER_LOG" 2>&1
          CODE=${PIPESTATUS[0]:-$?}
          set -e
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          if [ "$CODE" != "0" ]; then
            printf '{"phase":"tests-failed","exitCode":%s}' "$CODE" > "$CHOFTER_PHASE"
            echo "Setup FAILED (exit $CODE). $(wc -l < "$CHOFTER_LOG" | tr -d " ") lines of output, also kept on the build machine."
          fi
          exit "$CODE"

      - name: Test
        id: tests
        if: steps.setup.outcome == 'success'
        continue-on-error: true
        env:
          CHOFTER_LOG: ${{ steps.prep.outputs.log }}
          CHOFTER_PHASE: ${{ steps.prep.outputs.phase }}
        run: |
          printf '=== test: %s ===\n' 'bash scripts/test-all.sh' >> "$CHOFTER_LOG"
          set +e
          { bash scripts/test-all.sh; } >> "$CHOFTER_LOG" 2>&1
          CODE=${PIPESTATUS[0]:-$?}
          set -e
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          PHASE="$CHOFTER_PHASE"
          if [ "$CODE" != "0" ]; then
            printf '{"phase":"tests-failed","exitCode":%s}' "$CODE" > "$PHASE"
          fi
          LINES=$(wc -l < "$CHOFTER_LOG" | tr -d " ")
          if [ "$CODE" = "0" ]; then
            echo "Tests passed. $LINES lines of output, also kept on the build machine."
          else
            echo "Tests FAILED (exit $CODE). $LINES lines of output, also kept on the build machine."
          fi
          echo ""
          echo "The same output is on the build machine ($(hostname)), where it outlives"
          echo "GitHub's retention. To read it:"
          echo "  log         ${CHOFTER_LOG_URL:-}"
          echo "  terminal    ./chofter logs ${{ github.repository }} ${{ github.run_id }}"
          echo "  file        $CHOFTER_LOG"
          # Exit truthfully. continue-on-error keeps the job going;
          # the last step turns this into the run/commit status.
          exit "$CODE"

      - name: Claude Code — propose a fix
        id: autofix
        if: (steps.setup.outcome == 'failure' || steps.tests.outcome == 'failure' || steps.e2e.outcome == 'failure') && (github.event_name == 'push' || github.event.inputs.autofix == 'true')
        env:
          CHOFTER_PHASE: ${{ steps.prep.outputs.phase }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "chofter-ci[bot]"
          git config user.email "chofter-ci@users.noreply.github.com"
          OPEN_PR=$(gh pr list --repo "${{ github.repository }}" \
            --head "chofter/fix-${{ github.sha }}" --state open \
            --json number --jq 'length' 2>/dev/null || echo 0)
          if [ "${OPEN_PR:-0}" != "0" ]; then
            echo "An autofix pull request is already open for this commit. Skipping."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
            CODE="${{ steps.tests.outputs.exit_code }}"
            [ -n "$CODE" ] || CODE="${{ steps.setup.outputs.exit_code }}"
            [ -n "$CODE" ] || CODE=1
            printf '{"phase":"autofix","exitCode":%s}' "$CODE" > "$CHOFTER_PHASE"
          fi

      - name: Run the agent
        if: steps.autofix.outputs.skipped == 'false'
        env:
          CHOFTER_PR: ${{ steps.prep.outputs.prscript }}
          CHOFTER_PR_FILE: ${{ steps.prep.outputs.dir }}/pr-${{ github.run_id }}.md
          CHOFTER_LOG: ${{ steps.prep.outputs.log }}
          CHOFTER_DIR: ${{ steps.prep.outputs.dir }}
          CHOFTER_BASELINE: ${{ steps.prep.outputs.dir }}/baseline-${{ github.run_id }}.txt
          CHOFTER_RUN_ID: ${{ github.run_id }}
          CHOFTER_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CHOFTER_REPO: ${{ github.repository }}
          CHOFTER_SHA: ${{ github.sha }}
          CHOFTER_BASE: main
          CHOFTER_BRANCH: chofter/fix-${{ github.sha }}
          CHOFTER_TEST_CMD: "bash scripts/test-all.sh"
          CHOFTER_EVIDENCE: tail
          CHOFTER_EVIDENCE_LINES: 200
          CHOFTER_PR_DRAFT: true
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CHOFTER_AGENT_LOG: ${{ steps.prep.outputs.agentlog }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          trap 'printf "Run the agent stopped at line %s (exit %s): %s\n" "$LINENO" "$?" "$BASH_COMMAND" >&2' ERR
          PROMPT_FILE="$CHOFTER_DIR/prompt-${{ github.run_id }}.md"
          CHOFTER_INSTRUCTIONS="$HOME/.chofter/prompts/shaneosullivan__agent-graph.md"
          {
            printf 'The build for %s failed on commit %s.\n\n' "$CHOFTER_REPO" "$CHOFTER_SHA"
            if [ "${{ steps.setup.outcome }}" = 'failure' ]; then
            printf 'The SETUP step failed (exit %s). It ran:\n\n    %s\n\n' "${{ steps.setup.outputs.exit_code }}" 'bash scripts/ci-setup.sh'
            printf 'The test step never ran, so nothing in %s was executed.\n\n' 'bash scripts/test-all.sh'
            else
            printf 'The TEST step failed (exit %s). It ran:\n\n    %s\n\n' "${{ steps.tests.outputs.exit_code }}" 'bash scripts/test-all.sh'
            printf 'The setup step succeeded, so %s is not the problem.\n\n' 'bash scripts/ci-setup.sh'
            fi
            printf 'Its full output is in %s on this machine.\n\n' "$CHOFTER_LOG"
            printf 'The PR script will verify your fix by re-running:\n\n    %s\n\n' "$CHOFTER_TEST_CMD"
            if [ -f "$CHOFTER_INSTRUCTIONS" ]; then
              cat "$CHOFTER_INSTRUCTIONS"
            else
              cat <<'CHOFTER_PROMPT_EOF'
              The failing step and its command are named above, and the log holds that
              step's output. Read it first. It is outside the repository on purpose — do
              not copy it in, and do not commit it. If the setup step failed, no test ran
              at all: do not reason about which test broke.

              Your job:
                1. Confirm the failure from the log. Run something yourself only if the
                   log does not already make the cause clear, and then run the smallest
                   thing that shows it — the one test, the one script, the one file —
                   not the whole command that failed.
                2. Find the root cause and fix it in the source code.
                3. Check the fix with that same narrow command. You do not need to run
                   the full verification: the step after you re-runs it, so doing it here
                   only spends the time twice.
                4. Write the pull request text to "$CHOFTER_PR_FILE" — a markdown file
                   OUTSIDE the repository. The first line must be "# <title>"; everything
                   after it is the description. Explain what failed, the root cause, what
                   you changed, and how you verified it.
                5. Stop. That is the whole job.

                   Leave the fix in the working tree and the text in that file. The step
                   after you re-runs the verification, commits, pushes, opens the pull
                   request and attaches the before and after logs as evidence. You do not
                   run it, wait for it, or check on it — and if you try, you will spend
                   your session waiting on something that outlives you anyway.

                   If the verification still fails, that step opens a "[needs help]" pull
                   request recording how far you got, with the failing output attached.
                   So a fix you are unsure of is still worth leaving: say so in the text.

              Dependencies are already installed in this working directory — you do not
              need to run the setup command again.

              Work narrowly. Every tool call spends one of a fixed number of turns, and
              running out of them ends the attempt with nothing to show — no fix, no PR,
              and the time spent anyway. So:

                - The log usually names the file and the line. Go there. Do not survey
                  the repository first.
                - Read a file once. If you need it again, it is still what you read.
                - Prefer reading code over running anything. A build or a suite that
                  takes minutes is worth running only when it is the one thing that can
                  tell you whether the fix holds.
                - Prefer a targeted command over a whole pipeline: the single test, the
                  single script, not the command that wraps them.
                - This runner is shared. Time spent here is time no other repo can build.
                - Never leave something running when you stop. Nothing outlives your
                  session, so anything unfinished at that point is killed unfinished.

              Hard rules:
                - Do not run git commit, git push, or gh pr create. The step after you
                  does all of it, and it is what attaches the evidence.
                - Fix the source code. Never delete, skip, weaken, or rewrite a test in order
                  to make it pass. Never add .skip/.only/xfail/t.Skip or loosen an assertion.
                - If you conclude the test itself is genuinely wrong, do NOT change it.
                  Say so in the PR text and stop — a PR with no code change still gets
                  opened, so a human can read your reasoning.
                - Do not touch unrelated files, reformat the repo, or bump dependencies.
                - Do not modify anything under .github/.
                - Never change an env file — .env, .env.*, or anything named *.env. They
                  hold configuration and credentials, not code, and a value that looks
                  wrong to you may be the only correct one. If the failure is genuinely
                  caused by an env file, leave it exactly as it is and say so in the PR
                  text: name the file, the variable, and what you believe it should be.
                  A human will make that change.
                - If you cannot make it pass, say so plainly in the PR text and stop
                  anyway. A recorded attempt someone can read beats no attempt at all.
          CHOFTER_PROMPT_EOF
            fi
          } > "$PROMPT_FILE"
          git diff --name-only HEAD 2>/dev/null | while IFS= read -r f; do
            [ -f "$f" ] || continue
            printf '%s\t%s\n' "$(git hash-object "$f")" "$f"
          done > "$CHOFTER_BASELINE" 2>/dev/null || : > "$CHOFTER_BASELINE"

          CLAUDE_BIN="$(command -v claude || true)"
          unix_path() { printf '%s' "$1" | tr '\\' /; }
          for root in \
            "$(unix_path "${LOCALAPPDATA:-}")"/Packages/Claude_*/LocalCache/Roaming/Claude/claude-code \
            "$(unix_path "${APPDATA:-}")"/Claude/claude-code
          do
            [ -n "$CLAUDE_BIN" ] && break
            [ -d "$root" ] || continue
            CLAUDE_BIN="$(ls -1d "$root"/*/claude.exe 2>/dev/null | sort -V | tail -1 || true)"
          done
          if [ -z "$CLAUDE_BIN" ]; then
            echo "Claude Code CLI not found. Install it, or add it to PATH on this runner." >&2
            exit 1
          fi
          set +e
          trap - ERR
          { "$CLAUDE_BIN" -p "$(cat "$PROMPT_FILE")" \
            --max-turns 150 \
            --allowed-tools Read,Edit,Write,Glob,Grep,Bash \
            --output-format stream-json --verbose \
            --permission-mode acceptEdits; } >> "$CHOFTER_AGENT_LOG" 2>&1
          AGENT_CODE=${PIPESTATUS[0]:-$?}
          set -e
          LINES=$(wc -l < "$CHOFTER_AGENT_LOG" 2>/dev/null | tr -d " " || echo 0)
          if grep -qE "Reached max turns|error_max_turns" "$CHOFTER_AGENT_LOG" 2>/dev/null; then
            echo "The agent ran out of turns before it finished. $LINES lines of output."
          elif [ "$AGENT_CODE" = "0" ]; then
            echo "The agent finished. $LINES lines of its output."
          else
            echo "The agent exited $AGENT_CODE. $LINES lines of its output."
          fi
          echo "Rendered readably in the ChofterCI panel; raw at $CHOFTER_AGENT_LOG"
          exit 0

      - name: Open the pull request
        if: steps.autofix.outputs.skipped == 'false'
        continue-on-error: true
        env:
          CHOFTER_PR: ${{ steps.prep.outputs.prscript }}
          CHOFTER_PR_FILE: ${{ steps.prep.outputs.dir }}/pr-${{ github.run_id }}.md
          CHOFTER_LOG: ${{ steps.prep.outputs.log }}
          CHOFTER_DIR: ${{ steps.prep.outputs.dir }}
          CHOFTER_BASELINE: ${{ steps.prep.outputs.dir }}/baseline-${{ github.run_id }}.txt
          CHOFTER_RUN_ID: ${{ github.run_id }}
          CHOFTER_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CHOFTER_REPO: ${{ github.repository }}
          CHOFTER_SHA: ${{ github.sha }}
          CHOFTER_BASE: main
          CHOFTER_BRANCH: chofter/fix-${{ github.sha }}
          CHOFTER_TEST_CMD: "bash scripts/test-all.sh"
          CHOFTER_EVIDENCE: tail
          CHOFTER_EVIDENCE_LINES: 200
          CHOFTER_PR_DRAFT: true
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ ! -s "$CHOFTER_PR_FILE" ]; then
            echo "The agent wrote no pull request text, so there is nothing to open."
            exit 0
          fi
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "Opening a pull request for the changes the agent made."
          else
            echo "The agent changed no files; opening a PR for its reasoning."
          fi
          bash "$CHOFTER_PR" --pr-file "$CHOFTER_PR_FILE" --allow-failing

      - name: Slow checks
        id: e2e
        if: ${{ !cancelled() && steps.prep.outcome == 'success' }}
        continue-on-error: true
        env:
          CHOFTER_LOG: ${{ steps.prep.outputs.log }}
          CHOFTER_DIR: ${{ steps.prep.outputs.dir }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          printf '=== slow checks: %s ===\n' 'bash scripts/ci-slow-checks.sh' >> "$CHOFTER_LOG"
          set +e
          { bash scripts/ci-slow-checks.sh; } >> "$CHOFTER_LOG" 2>&1
          CODE=${PIPESTATUS[0]:-$?}
          set -e
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          if [ "$CODE" = "0" ]; then
            echo "Slow checks passed."
            exit 0
          fi
          echo "Slow checks FAILED (exit $CODE). Output also kept on the build machine."
          PR=$(gh pr list --repo "${{ github.repository }}" --head "chofter/fix-${{ github.sha }}" \
            --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$PR" ]; then
            {
              printf 'The slow checks did not pass on this branch.\n\n'
              printf 'They were not run before the PR was opened — they are too slow to\n'
              printf 'hold one open — so this is something still to look at rather than\n'
              printf 'necessarily a regression the fix introduced.\n\n'
              printf '```\n'
              tail -n 60 "$CHOFTER_LOG" | sed 's/\x1b\[[0-9;]*[A-Za-z]//g'
              printf '```\n'
            } > "$CHOFTER_DIR/e2e-${{ github.run_id }}.md"
            gh pr comment "$PR" --repo "${{ github.repository }}" \
              --body-file "$CHOFTER_DIR/e2e-${{ github.run_id }}.md" >/dev/null \
              && echo "Commented on PR #$PR."
          fi
          exit "$CODE"

      - name: Claude Code — fix the slow checks
        id: autofix_e2e
        if: steps.e2e.outcome == 'failure' && steps.tests.outcome == 'success' && (github.event_name == 'push' || github.event.inputs.autofix == 'true')
        env:
          CHOFTER_PHASE: ${{ steps.prep.outputs.phase }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "chofter-ci[bot]"
          git config user.email "chofter-ci@users.noreply.github.com"
          OPEN_PR=$(gh pr list --repo "${{ github.repository }}" \
            --head "chofter/fix-${{ github.sha }}" --state open \
            --json number --jq 'length' 2>/dev/null || echo 0)
          if [ "${OPEN_PR:-0}" != "0" ]; then
            echo "An autofix pull request is already open for this commit. Skipping."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
            CODE="${{ steps.e2e.outputs.exit_code }}"
            [ -n "$CODE" ] || CODE=1
            printf '{"phase":"autofix","exitCode":%s}' "$CODE" > "$CHOFTER_PHASE"
          fi

      - name: Run the agent on the slow checks
        if: steps.autofix_e2e.outputs.skipped == 'false'
        env:
          CHOFTER_PR: ${{ steps.prep.outputs.prscript }}
          CHOFTER_PR_FILE: ${{ steps.prep.outputs.dir }}/pr-${{ github.run_id }}.md
          CHOFTER_LOG: ${{ steps.prep.outputs.log }}
          CHOFTER_DIR: ${{ steps.prep.outputs.dir }}
          CHOFTER_BASELINE: ${{ steps.prep.outputs.dir }}/baseline-${{ github.run_id }}.txt
          CHOFTER_RUN_ID: ${{ github.run_id }}
          CHOFTER_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CHOFTER_REPO: ${{ github.repository }}
          CHOFTER_SHA: ${{ github.sha }}
          CHOFTER_BASE: main
          CHOFTER_BRANCH: chofter/fix-${{ github.sha }}
          CHOFTER_TEST_CMD: "{ bash scripts/test-all.sh; } && { bash scripts/ci-slow-checks.sh; }"
          CHOFTER_EVIDENCE: tail
          CHOFTER_EVIDENCE_LINES: 200
          CHOFTER_PR_DRAFT: true
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CHOFTER_AGENT_LOG: ${{ steps.prep.outputs.agentlog }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          trap 'printf "Run the agent on the slow checks stopped at line %s (exit %s): %s\n" "$LINENO" "$?" "$BASH_COMMAND" >&2' ERR
          PROMPT_FILE="$CHOFTER_DIR/prompt-${{ github.run_id }}.md"
          CHOFTER_INSTRUCTIONS="$HOME/.chofter/prompts/shaneosullivan__agent-graph.md"
          {
            printf 'The build for %s failed on commit %s.\n\n' "$CHOFTER_REPO" "$CHOFTER_SHA"
            printf 'The SLOW CHECKS failed (exit %s). They ran:\n\n    %s\n\n' "${{ steps.e2e.outputs.exit_code }}" 'bash scripts/ci-slow-checks.sh'
            printf 'The setup and test steps passed, so %s is not what broke. The failure is in the section headed "=== slow checks" at the end of the log.\n\n' 'bash scripts/test-all.sh'
            printf 'The slow checks take a long time. Do not run them whole: run only the one failing end-to-end test, and only if the log does not already show the cause. The step after you re-runs the tests and then all of the slow checks to verify your fix.\n\n'
            printf 'Its full output is in %s on this machine.\n\n' "$CHOFTER_LOG"
            printf 'The PR script will verify your fix by re-running:\n\n    %s\n\n' "$CHOFTER_TEST_CMD"
            if [ -f "$CHOFTER_INSTRUCTIONS" ]; then
              cat "$CHOFTER_INSTRUCTIONS"
            else
              cat <<'CHOFTER_PROMPT_EOF'
              The failing step and its command are named above, and the log holds that
              step's output. Read it first. It is outside the repository on purpose — do
              not copy it in, and do not commit it. If the setup step failed, no test ran
              at all: do not reason about which test broke.

              Your job:
                1. Confirm the failure from the log. Run something yourself only if the
                   log does not already make the cause clear, and then run the smallest
                   thing that shows it — the one test, the one script, the one file —
                   not the whole command that failed.
                2. Find the root cause and fix it in the source code.
                3. Check the fix with that same narrow command. You do not need to run
                   the full verification: the step after you re-runs it, so doing it here
                   only spends the time twice.
                4. Write the pull request text to "$CHOFTER_PR_FILE" — a markdown file
                   OUTSIDE the repository. The first line must be "# <title>"; everything
                   after it is the description. Explain what failed, the root cause, what
                   you changed, and how you verified it.
                5. Stop. That is the whole job.

                   Leave the fix in the working tree and the text in that file. The step
                   after you re-runs the verification, commits, pushes, opens the pull
                   request and attaches the before and after logs as evidence. You do not
                   run it, wait for it, or check on it — and if you try, you will spend
                   your session waiting on something that outlives you anyway.

                   If the verification still fails, that step opens a "[needs help]" pull
                   request recording how far you got, with the failing output attached.
                   So a fix you are unsure of is still worth leaving: say so in the text.

              Dependencies are already installed in this working directory — you do not
              need to run the setup command again.

              Work narrowly. Every tool call spends one of a fixed number of turns, and
              running out of them ends the attempt with nothing to show — no fix, no PR,
              and the time spent anyway. So:

                - The log usually names the file and the line. Go there. Do not survey
                  the repository first.
                - Read a file once. If you need it again, it is still what you read.
                - Prefer reading code over running anything. A build or a suite that
                  takes minutes is worth running only when it is the one thing that can
                  tell you whether the fix holds.
                - Prefer a targeted command over a whole pipeline: the single test, the
                  single script, not the command that wraps them.
                - This runner is shared. Time spent here is time no other repo can build.
                - Never leave something running when you stop. Nothing outlives your
                  session, so anything unfinished at that point is killed unfinished.

              Hard rules:
                - Do not run git commit, git push, or gh pr create. The step after you
                  does all of it, and it is what attaches the evidence.
                - Fix the source code. Never delete, skip, weaken, or rewrite a test in order
                  to make it pass. Never add .skip/.only/xfail/t.Skip or loosen an assertion.
                - If you conclude the test itself is genuinely wrong, do NOT change it.
                  Say so in the PR text and stop — a PR with no code change still gets
                  opened, so a human can read your reasoning.
                - Do not touch unrelated files, reformat the repo, or bump dependencies.
                - Do not modify anything under .github/.
                - Never change an env file — .env, .env.*, or anything named *.env. They
                  hold configuration and credentials, not code, and a value that looks
                  wrong to you may be the only correct one. If the failure is genuinely
                  caused by an env file, leave it exactly as it is and say so in the PR
                  text: name the file, the variable, and what you believe it should be.
                  A human will make that change.
                - If you cannot make it pass, say so plainly in the PR text and stop
                  anyway. A recorded attempt someone can read beats no attempt at all.
          CHOFTER_PROMPT_EOF
            fi
          } > "$PROMPT_FILE"
          git diff --name-only HEAD 2>/dev/null | while IFS= read -r f; do
            [ -f "$f" ] || continue
            printf '%s\t%s\n' "$(git hash-object "$f")" "$f"
          done > "$CHOFTER_BASELINE" 2>/dev/null || : > "$CHOFTER_BASELINE"

          CLAUDE_BIN="$(command -v claude || true)"
          unix_path() { printf '%s' "$1" | tr '\\' /; }
          for root in \
            "$(unix_path "${LOCALAPPDATA:-}")"/Packages/Claude_*/LocalCache/Roaming/Claude/claude-code \
            "$(unix_path "${APPDATA:-}")"/Claude/claude-code
          do
            [ -n "$CLAUDE_BIN" ] && break
            [ -d "$root" ] || continue
            CLAUDE_BIN="$(ls -1d "$root"/*/claude.exe 2>/dev/null | sort -V | tail -1 || true)"
          done
          if [ -z "$CLAUDE_BIN" ]; then
            echo "Claude Code CLI not found. Install it, or add it to PATH on this runner." >&2
            exit 1
          fi
          set +e
          trap - ERR
          { "$CLAUDE_BIN" -p "$(cat "$PROMPT_FILE")" \
            --max-turns 150 \
            --allowed-tools Read,Edit,Write,Glob,Grep,Bash \
            --output-format stream-json --verbose \
            --permission-mode acceptEdits; } >> "$CHOFTER_AGENT_LOG" 2>&1
          AGENT_CODE=${PIPESTATUS[0]:-$?}
          set -e
          LINES=$(wc -l < "$CHOFTER_AGENT_LOG" 2>/dev/null | tr -d " " || echo 0)
          if grep -qE "Reached max turns|error_max_turns" "$CHOFTER_AGENT_LOG" 2>/dev/null; then
            echo "The agent ran out of turns before it finished. $LINES lines of output."
          elif [ "$AGENT_CODE" = "0" ]; then
            echo "The agent finished. $LINES lines of its output."
          else
            echo "The agent exited $AGENT_CODE. $LINES lines of its output."
          fi
          echo "Rendered readably in the ChofterCI panel; raw at $CHOFTER_AGENT_LOG"
          exit 0

      - name: Open the pull request for the slow checks
        if: steps.autofix_e2e.outputs.skipped == 'false'
        continue-on-error: true
        env:
          CHOFTER_PR: ${{ steps.prep.outputs.prscript }}
          CHOFTER_PR_FILE: ${{ steps.prep.outputs.dir }}/pr-${{ github.run_id }}.md
          CHOFTER_LOG: ${{ steps.prep.outputs.log }}
          CHOFTER_DIR: ${{ steps.prep.outputs.dir }}
          CHOFTER_BASELINE: ${{ steps.prep.outputs.dir }}/baseline-${{ github.run_id }}.txt
          CHOFTER_RUN_ID: ${{ github.run_id }}
          CHOFTER_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CHOFTER_REPO: ${{ github.repository }}
          CHOFTER_SHA: ${{ github.sha }}
          CHOFTER_BASE: main
          CHOFTER_BRANCH: chofter/fix-${{ github.sha }}
          CHOFTER_TEST_CMD: "{ bash scripts/test-all.sh; } && { bash scripts/ci-slow-checks.sh; }"
          CHOFTER_EVIDENCE: tail
          CHOFTER_EVIDENCE_LINES: 200
          CHOFTER_PR_DRAFT: true
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ ! -s "$CHOFTER_PR_FILE" ]; then
            echo "The agent wrote no pull request text, so there is nothing to open."
            exit 0
          fi
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "Opening a pull request for the changes the agent made."
          else
            echo "The agent changed no files; opening a PR for its reasoning."
          fi
          bash "$CHOFTER_PR" --pr-file "$CHOFTER_PR_FILE" --allow-failing

      - name: Find artifacts.txt
        id: artifacts
        if: always()
        run: |
          F="${CHOFTER_OUTPUT_DIR:-}/artifacts.txt"
          if [ -n "${CHOFTER_OUTPUT_DIR:-}" ] && [ -s "$F" ]; then
            command -v cygpath >/dev/null 2>&1 && F="$(cygpath -w "$F")"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "path=$F" >> "$GITHUB_OUTPUT"
            echo "Uploading artifacts.txt: $(grep -c . "${CHOFTER_OUTPUT_DIR}/artifacts.txt") URL(s)."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No artifacts.txt in the run's output directory; nothing to upload."
          fi

      - name: Upload artifacts.txt
        if: always() && steps.artifacts.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: ${{ steps.artifacts.outputs.path }}
          if-no-files-found: ignore

      - name: Record the run locally
        if: always()
        env:
          CHOFTER_LOG: ${{ steps.prep.outputs.log }}
          CHOFTER_DIR: ${{ steps.prep.outputs.dir }}
          CHOFTER_STARTED: ${{ steps.prep.outputs.started }}
          CHOFTER_CODE: ${{ steps.tests.outputs.exit_code }}
          CHOFTER_SETUP_CODE: ${{ steps.setup.outputs.exit_code }}
          CHOFTER_E2E_CODE: ${{ steps.e2e.outputs.exit_code }}
          CHOFTER_JOB_STATUS: ${{ job.status }}
          CHOFTER_TEST_CMD: "bash scripts/test-all.sh"
          CHOFTER_AUTOFIX: ${{ steps.autofix.outputs.skipped == 'false' || steps.autofix_e2e.outputs.skipped == 'false' }}
        run: |
          # A run cancelled by a newer push never finished its tests, so it is
          # neither a pass nor a fail. Recording it as "failure" would put a
          # red dot on the dashboard for something that never ran.
          CODE="${CHOFTER_CODE:-}"
          if [ -n "${CHOFTER_SETUP_CODE:-}" ] && [ "${CHOFTER_SETUP_CODE}" != "0" ]; then
            CODE="$CHOFTER_SETUP_CODE"
          fi
          E2E_CODE="${CHOFTER_E2E_CODE:-0}"
          if [ "$CHOFTER_JOB_STATUS" = "cancelled" ]; then
            CONCLUSION="cancelled"
          elif [ "$CODE" = "0" ] && [ "$E2E_CODE" = "0" ]; then
            CONCLUSION="success"
          else
            CONCLUSION="failure"
          fi
          ENDED=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          BYTES=$(wc -c < "$CHOFTER_LOG" 2>/dev/null | tr -d " " || echo 0)
          MSG=$(git log -1 --pretty=%s 2>/dev/null || echo "")
          URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          OUT="$CHOFTER_DIR/${{ github.run_id }}.json"
          if command -v jq >/dev/null 2>&1; then
            jq -n \
              --arg runId "${{ github.run_id }}" --arg repo "${{ github.repository }}" \
              --arg sha "${{ github.sha }}" --arg branch "${{ github.ref_name }}" \
              --arg event "${{ github.event_name }}" --arg message "$MSG" \
              --arg startedAt "$CHOFTER_STARTED" --arg endedAt "$ENDED" \
              --arg url "$URL" --arg testCommand "$CHOFTER_TEST_CMD" \
              --arg conclusion "$CONCLUSION" \
              --argjson exitCode "${CODE:-null}" --argjson logBytes "$BYTES" \
              --argjson e2eExitCode "${E2E_CODE:-null}" \
              --argjson autofixRan "${CHOFTER_AUTOFIX:-false}" \
              '$ARGS.named' > "$OUT.new"
            if [ -f "$OUT" ]; then
              # chofter-pr may already have written prUrl/prNumber here.
              jq -s '.[0] * .[1]' "$OUT" "$OUT.new" > "$OUT.tmp" && mv "$OUT.tmp" "$OUT"
              rm -f "$OUT.new"
            else
              mv "$OUT.new" "$OUT"
            fi
          else
            # jq is installed by setup/2-wsl-bootstrap.sh; this is the safety net.
            printf '{"runId":"%s","repo":"%s","sha":"%s","branch":"%s","event":"%s","startedAt":"%s","endedAt":"%s","url":"%s","exitCode":%s,"logBytes":%s,"conclusion":"%s"}\n' \
              "${{ github.run_id }}" "${{ github.repository }}" "${{ github.sha }}" "${{ github.ref_name }}" \
              "${{ github.event_name }}" "$CHOFTER_STARTED" "$ENDED" "$URL" "${CODE:-null}" "$BYTES" \
              "$CONCLUSION" > "$OUT"
          fi
          echo "Recorded $OUT"

      - name: Report the test result
        if: (steps.setup.outcome == 'failure' || steps.tests.outcome == 'failure' || steps.e2e.outcome == 'failure')
        run: |
          if [ "${{ steps.setup.outcome }}" = "failure" ]; then
            echo "Failing the run because the setup command failed."
          else
            echo "Failing the run because the test suite failed."
          fi
          exit 1
