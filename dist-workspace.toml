[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew", "npm"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-musl",
    "aarch64-pc-windows-msvc",
    "x86_64-pc-windows-msvc",
]
# Path that installers should place binaries in
install-path = ["$XDG_BIN_HOME/", "$XDG_DATA_HOME/../bin", "~/.local/bin"]
# Whether to install an updater program
install-updater = false
# A GitHub repo to push Homebrew formulas to
tap = "chofter/homebrew-tap"
# Publish jobs to run in CI
publish-jobs = ["homebrew", "npm", "./notarize"]
# Jobs to run once the release is out
post-announce-jobs = ["./winget"]
# The npm package to publish
npm-package = "agent-graph"
# Sign the macOS binaries with a Developer ID (secrets: CODESIGN_*), for
# the notarize job to submit to Apple
macos-sign = true
# Steps run before each build: hardened-runtime signing, which notarization
# requires, and cargo-xwin's clang mode for Windows on ARM
github-build-setup = "../build-setup.yml"
