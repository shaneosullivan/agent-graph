[package]
name = "agent-graph-wasm"
version = "0.1.0"
edition = "2024"
description = "Agent Graph's reducer and timeline for the browser, as WebAssembly"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
agent-graph = { path = "..", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
