<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Graph</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M9 9v14M9 16h14' stroke='%233b5bdb' stroke-width='3' fill='none'/%3E%3Ccircle cx='9' cy='8' r='5' fill='%233b5bdb'/%3E%3Ccircle cx='24' cy='16' r='5' fill='%237c4dff'/%3E%3Ccircle cx='9' cy='24' r='5' fill='%231f9d55'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button id="back" class="back-btn" type="button" hidden>
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg>
      Sessions
    </button>
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M9 9v14M9 16h14" stroke="currentColor" stroke-width="2.5" fill="none"/><circle cx="9" cy="8" r="4.5" class="b1"/><circle cx="24" cy="16" r="4.5" class="b2"/><circle cx="9" cy="24" r="4.5" class="b3"/></svg>
      <span>Agent Graph</span>
    </div>
    <div class="topbar-end">
      <div id="page-toggles" class="toggles" hidden>
        <label class="toggle done-toggle" title="Include finished agents and the sessions they started">
          <input type="checkbox" id="show-done-page" checked> Completed
        </label>
      </div>
      <div id="mode" class="mode" role="status" aria-live="polite"></div>
    </div>
  </header>

  <div class="layout">
    <aside class="sessions" aria-labelledby="sessions-title">
      <div class="panel-head">
        <h2 id="sessions-title">Sessions</h2>
        <div class="toggles">
          <label class="toggle done-toggle" title="Include finished sessions, agents and the sessions they started">
            <input type="checkbox" id="show-done" checked> Completed
          </label>
          <label class="toggle" title="Include sessions with no activity in the last 24 hours">
            <input type="checkbox" id="show-all"> Older
          </label>
          <details id="app-filter" class="app-filter" hidden>
            <summary class="toggle" title="Show sessions from these apps">Apps: <span id="app-filter-label">All</span></summary>
            <div class="app-menu" role="group" aria-label="Apps to show"></div>
          </details>
        </div>
        <div id="attention" class="attention-nav" hidden></div>
      </div>
      <ul id="session-list" class="session-list"></ul>
    </aside>

    <main id="main">
      <div id="banner" class="banner" hidden></div>
      <div id="view"></div>
    </main>

    <aside id="detail" class="detail" aria-label="Details"></aside>
  </div>

  <footer class="timeline" aria-label="Timeline">
    <div class="steppers">
      <button id="prev" class="icon-btn" aria-label="Previous step" title="Previous step (←)">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" /></svg>
      </button>
      <button id="next" class="icon-btn" aria-label="Next step" title="Next step (→)">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5" /></svg>
      </button>
    </div>
    <div class="track" id="track">
      <div id="ticks" class="ticks" aria-hidden="true"></div>
      <input type="range" id="slider" min="0" max="0" value="0" step="1" aria-label="Timeline step">
      <div id="hover-tip" class="hover-tip" hidden></div>
    </div>
    <button id="live" class="live-btn" title="Jump to now and follow new events (L)">
      <span class="live-dot" aria-hidden="true"></span><span id="live-text">Live</span>
    </button>
    <div class="caption-row">
      <div class="caption">
        <span id="step-count" class="step-count"></span>
        <span id="step-time" class="step-time"></span>
        <span id="step-label" class="step-label"></span>
      </div>
      <ul class="legend" aria-label="Legend">
        <li><span class="swatch lifecycle"></span>Session</li>
        <li><span class="swatch agent"></span>Agents</li>
        <li><span class="swatch task"></span>Tasks</li>
        <li><span class="swatch attention"></span>Needs you</li>
        <li><span class="swatch message"></span>Messages</li>
      </ul>
    </div>
  </footer>
</div>
</body>
</html>
