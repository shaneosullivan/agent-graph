[package]
name = "agent-graph"
version = "0.1.24"
edition = "2024"
rust-version = "1.85"
description = "Records a live graph of AI coding agent sessions from provider hooks"
license = "MIT"
repository = "https://github.com/shaneosullivan/agent-graph"
homepage = "https://agentgraph.chofter.com"

[features]
default = ["cli"]
# Everything the command-line tool needs. Without it, the crate is just the
# event model and reducer, which also builds for WebAssembly (see wasm/).
cli = ["dep:clap", "dep:crossterm", "dep:resvg", "dep:ring", "dep:toml_edit", "dep:dunce", "dep:ulid", "dep:ureq", "dep:libc", "dep:windows-sys", "dep:rusqlite"]

[dependencies]
base64 = "0.23.1"
humantime = "2.4.0"
# Keyframes' state is deflated (src/reducer.rs).
miniz_oxide = "0.9.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
clap = { version = "4.6.7", features = ["derive"], optional = true }
crossterm = { version = "0.29.0", optional = true }
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts", "memmap-fonts"], optional = true }
# SHA-256 and randomness for logging in (account.rs); already in the build, for ureq's TLS.
ring = { version = "0.17.14", optional = true }
ulid = { version = "3.0.0", optional = true }
ureq = { version = "3.4.2", optional = true }
# Paths as Codex names them in its hook trust keys: canonical, without
# Windows' \\?\ prefix where it can do without (Codex uses it too).
dunce = { version = "1.0.5", optional = true }
# Trusting Codex hooks in its config.toml (src/install.rs), keeping the file as it was.
toml_edit = { version = "0.25.15", default-features = false, features = ["parse", "display"], optional = true }
# Reading Cursor's app's chats' names from its SQLite database
# (src/adapter/cursor.rs). Bundled: SQLite compiled in, from C, as ring's
# C is, so it's the same on every platform, with nothing to install.
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }

# Reading the process tree (src/process.rs) and handling Ctrl+C in `run`.
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2.189", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", optional = true, features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[dev-dependencies]
jsonschema = { version = "0.58.0", default-features = false }
tempfile = "3.27.0"
ulid = "3.0.0"

# A thread's CPU time, for timing tests that other work mustn't sway.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading", "Win32_System_WindowsProgramming"] }

[[bin]]
name = "agent-graph"
path = "src/main.rs"
required-features = ["cli"]

[workspace]
members = [".", "wasm"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Release builds for `dist` (dist-workspace.toml): prebuilt binaries per
# platform, and the installers and packages that fetch them.
[profile.dist]
inherits = "release"

# For the WebAssembly build: small, and panics abort (wasm can't unwind).
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
panic = "abort"

[build-dependencies]
serde_json = "1"
